<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Documentation</title>
    <style>
        html {
            box-sizing: border-box;
            overflow-y: scroll;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div id="api-reference"></div>

    <script src="../_api_shop/scalar-1.68.0.js"></script>
    <script>
        window.addEventListener('load', function () {
            const query = new URLSearchParams(window.location.search)
            const schemaUrl = query.get('url') || new URL(
                '../openapi.json',
                window.location.href
            ).toString()

            Scalar.createApiReference('#api-reference', {
                url: schemaUrl,
                layout: 'modern',
                theme: 'default',
                showSidebar: true,
                hideModels: false,
                persistAuth: false,
                withDefaultFonts: true,
                agent: {
                    disabled: true
                },
                customFetch: function (input, init) {
                    const options = Object.assign({}, init, {
                        credentials: 'same-origin'
                    })
                    const inputHeaders = input instanceof Request
                        ? input.headers
                        : undefined
                    options.headers = new Headers(
                        options.headers || inputHeaders || {}
                    )

                    const csrfCookie = document.cookie.match(
                        /(?:^|;\s*)csrftoken=([^;]+)/
                    )
                    if (csrfCookie) {
                        options.headers.set(
                            'X-CSRFToken',
                            decodeURIComponent(csrfCookie[1])
                        )
                    }
                    return window.fetch(input, options)
                }
            })
        })
    </script>
</body>
</html>
